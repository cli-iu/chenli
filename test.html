<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>输入框测试</title>
<style>
body{font-family:-apple-system,"PingFang SC",sans-serif;margin:0;padding:16px;background:#f0f2f5;color:#111b21}
h1{font-size:18px;margin:4px 0 6px}
p{font-size:13px;color:#667781;line-height:1.5;margin:0 0 14px}
.t{margin-bottom:14px}
.t b{display:block;font-size:14px;margin-bottom:5px}
input,textarea,.ce{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:10px;border:1px solid #d1d7db;border-radius:8px;background:#fff;outline:none}
textarea{height:44px;resize:none}
.ce{min-height:44px}
.pw{-webkit-text-security:disc}
</style>
</head>
<body>
<h1>输入框测试</h1>
<p>挨个点下面每一个框，看键盘上方有没有「密码」那一栏。记下哪几个没有（用编号告诉我）。上下箭头和✓那一条不用管，它每个都有。</p>

<div class="t"><b>1  普通单行框</b><input type="text"></div>
<div class="t"><b>2  普通多行框</b><textarea></textarea></div>
<div class="t"><b>3  单行框，关掉自动填充</b><input type="text" autocomplete="off"></div>
<div class="t"><b>4  搜索框</b><input type="search" autocomplete="off"></div>
<div class="t"><b>5  多行框，关掉自动填充和纠错</b><textarea autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea></div>
<div class="t"><b>6  可编辑的 div（不是输入框）</b><div class="ce" contenteditable="true" role="textbox"></div></div>
<div class="t"><b>7  单行框，加了圆点遮挡（我们 key 那栏的写法）</b><input type="text" class="pw" autocomplete="off"></div>
<div class="t"><b>8  多行框，加了圆点遮挡</b><textarea class="pw" autocomplete="off"></textarea></div>
<div class="t"><b>9  单行框，写成一次性验证码</b><input type="text" autocomplete="one-time-code"></div>
<div class="t"><b>10  网址框</b><input type="url" autocomplete="off"></div>
</body>
</html>
